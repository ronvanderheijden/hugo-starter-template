{{ define "main" }}
<div class="container stack content">
    <header class="page-header stack">
        <h1>Page not found</h1>
        <p class="lead">Sorry, this page does not exist or may have moved.</p>
    </header>

    <p>No worries — you can pick up right where you left off:</p>

    <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
    </ul>
</div>
{{ end }}
