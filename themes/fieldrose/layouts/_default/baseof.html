<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    {{ partial "head.html" . }}
    {{ partial "stylesheets.html" . }}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    {{ partial "header.html" . }}

    <main id="main-content" class="site-main">
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
</body>
</html>
