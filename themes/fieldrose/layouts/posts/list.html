{{ define "main" }}
<div class="container stack content">
    {{ partial "page-header.html" . }}
    {{ .Content }}

    {{ $paginator := .Paginate .Pages }}
    <section class="stack" aria-label="Pages in this section">
        {{ partial "page-cards.html" $paginator.Pages }}
        {{ partial "pagination.html" . }}
    </section>
</div>
{{ end }}
